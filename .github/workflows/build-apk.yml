name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ app ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets & Setup Capacitor
        run: |
          mkdir -p www
          cp -r *.html *.js *.css www/ 2>/dev/null || true
          [ -d "functions" ] && cp -r functions www/ || true

          if [ ! -f "www/index.html" ] && [ -f "www/app.html" ]; then
            cp www/app.html www/index.html
          fi

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/push-notifications

          # Имя пакета bokser.rlteam.com строго совпадает с google-services.json
          npx cap init "BOKSER" "bokser.rlteam.com" --web-dir www
          npx cap add android

          # Копируем google-services.json внутрь Android-модуля
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

          if [ -f "icon.png" ]; then
            npm install @capacitor/assets
            mkdir -p assets
            cp icon.png assets/icon.png
            cp icon.png assets/icon-only.png
            npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' || true
          fi

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOKSER-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
