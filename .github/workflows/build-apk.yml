name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Setup Capacitor
        run: |
          mkdir -p www
          cp -r *.html *.js *.css www/ 2>/dev/null || true
          [ -d "functions" ] && cp -r functions www/ || true

          if [ ! -f "www/index.html" ] && [ -f "www/app.html" ]; then
            cp www/app.html www/index.html
          fi

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "BOKSER" "com.rlteam.bokser" --web-dir www
          npx cap add android

          # Привязываем путь к Android SDK и принимаем лицензии
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOKSER-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
