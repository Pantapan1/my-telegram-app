name: Build Android APK

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой
  push:
    branches: [ main ] # Автоматически собирать при изменениях в main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Setup Capacitor
        run: |
          # Создаем папку для веб-файлов
          mkdir -p www

          # Копируем всё содержимое репозитория в www (кроме служебных папок)
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name 'www' -exec cp -r {} www/ \;

          # Если нет index.html, используем app.html как стартовую страницу
          if [ ! -f "www/index.html" ] && [ -f "www/app.html" ]; then
            cp www/app.html www/index.html
          fi

          # Инициализируем проект и Capacitor
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Создаем Android-проект
          npx cap init "Pantapan App" "com.pantapan.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
