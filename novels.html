<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Новеллы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(180deg, #fff8f0 0%, #fff 200px); color: #2c3e50; padding-bottom: 40px;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .back-link {
        text-decoration: none; color: #2c3e50; background: #fff; width: 40px; height: 40px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); flex-shrink: 0; cursor: pointer; border: none; font-size: 18px;
    }
    h1 { font-size: 20px; margin: 0; flex: 1; }
    .coins-badge {
        background: linear-gradient(135deg, #ffb75e, #ed8f03); color: #fff; font-weight: 800; padding: 8px 14px;
        border-radius: 14px; font-size: 14px; box-shadow: 0 4px 12px rgba(237,143,3,0.3); flex-shrink: 0;
    }
    .novel-card {
        display: flex; gap: 12px; background: #fff; border-radius: 18px; padding: 12px; margin-bottom: 12px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.05); cursor: pointer;
    }
    .novel-cover {
        width: 72px; height: 96px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: linear-gradient(135deg,#6a1fb8,#2a1052);
        display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; font-weight: 800;
    }
    .novel-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .novel-title { font-weight: 800; font-size: 15px; margin-bottom: 4px; }
    .novel-desc { font-size: 12px; color: #7f8c8d; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .novel-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .novel-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 8px; }
    .badge-locked { background: #fdecea; color: #e74c3c; }
    .badge-unlocked { background: #eafaf1; color: #27ae60; }
    .badge-endings { background: #f4f1fe; color: #8a2fc9; }
    .empty-state { text-align: center; color: #95a5a6; padding: 40px 0; font-size: 14px; }

    /* ===================== ЧИТАЛКА ===================== */
    #reader {
        display: none; position: fixed; inset: 0; background: #000; z-index: 100; overflow: hidden;
    }
    #reader.active { display: block; }
    .reader-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity .25s ease; }
    .reader-sprite {
        position: absolute; bottom: 0; height: 78%; max-width: 70%; object-fit: contain; transition: all .25s ease; filter: brightness(.7);
    }
    .reader-sprite.speaking { filter: brightness(1); }
    .reader-sprite.pos-left { left: 2%; }
    .reader-sprite.pos-center { left: 50%; transform: translateX(-50%); }
    .reader-sprite.pos-right { right: 2%; }
    .reader-topbar { position: absolute; top: 0; left: 0; right: 0; padding: 14px; display: flex; justify-content: space-between; z-index: 5; }
    .reader-close {
        width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; border: none;
        font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .reader-skip-hint { color: rgba(255,255,255,.6); font-size: 11px; align-self: center; }
    .reader-dialogue-box {
        position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
        background: linear-gradient(0deg, rgba(0,0,0,.92) 30%, rgba(0,0,0,.75) 70%, rgba(0,0,0,0));
        z-index: 4; cursor: pointer;
    }
    .reader-speaker { color: #ffb75e; font-weight: 800; font-size: 14px; margin-bottom: 6px; }
    .reader-text { color: #fff; font-size: 15px; line-height: 1.5; min-height: 44px; }
    .reader-advance-hint { color: rgba(255,255,255,.45); font-size: 11px; margin-top: 8px; text-align: right; }
    .reader-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .reader-choice-btn {
        background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff; padding: 12px 14px;
        border-radius: 12px; font-size: 14px; text-align: left; cursor: pointer;
    }
    .reader-choice-btn:active { background: rgba(255,183,94,.3); }
    .reader-ending-screen {
        position: absolute; inset: 0; background: rgba(0,0,0,.88); z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding: 24px; text-align: center; color: #fff;
    }
    .reader-ending-title { font-size: 22px; font-weight: 800; color: #ffb75e; margin-bottom: 8px; }
    .reader-ending-name { font-size: 16px; opacity: .9; margin-bottom: 16px; }
    .reader-ending-reward { font-size: 14px; background: rgba(255,255,255,.1); padding: 10px 18px; border-radius: 12px; margin-bottom: 20px; }
    .reader-ending-actions { display: flex; gap: 10px; }
    .reader-ending-actions button {
        padding: 12px 20px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-size: 13px;
    }
    .btn-restart { background: linear-gradient(135deg,#ffb75e,#ed8f03); color: #fff; }
    .btn-back-list { background: rgba(255,255,255,.15); color: #fff; }
    .no-session { text-align: center; padding: 60px 20px; color: #95a5a6; }
    .unlock-modal-overlay {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    .unlock-modal-overlay.active { display: flex; }
    .unlock-modal { background: #fff; border-radius: 18px; padding: 22px; max-width: 320px; text-align: center; }
    .unlock-modal h3 { margin: 0 0 8px; font-size: 17px; }
    .unlock-modal p { color: #7f8c8d; font-size: 13px; margin-bottom: 18px; }
    .unlock-modal .btn-row { display: flex; gap: 8px; }
    .unlock-modal button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div class="container" id="list-view">
    <div class="topbar">
        <button class="back-link" onclick="history.back()">←</button>
        <h1>📖 Новеллы</h1>
        <div class="coins-badge" id="coins-badge">🪙 0</div>
    </div>
    <div id="novels-list"></div>
</div>

<div id="no-session" class="no-session" style="display:none;">Не удалось определить пользователя. Открой эту страницу через приложение.</div>

<div class="unlock-modal-overlay" id="unlock-modal-overlay">
    <div class="unlock-modal">
        <h3 id="unlock-modal-title">Открыть новеллу?</h3>
        <p id="unlock-modal-text"></p>
        <div class="btn-row">
            <button class="btn-back-list" onclick="closeUnlockModal()">Отмена</button>
            <button class="btn-restart" id="btn-confirm-unlock">Открыть</button>
        </div>
    </div>
</div>

<div id="reader">
    <div class="reader-bg" id="reader-bg"></div>
    <img class="reader-sprite" id="reader-sprite" style="display:none;">
    <div class="reader-topbar">
        <button class="reader-close" onclick="closeReader()">✕</button>
        <div class="reader-skip-hint">Тапни, чтобы продолжить</div>
    </div>
    <div class="reader-dialogue-box" id="reader-box" onclick="advanceReader()">
        <div class="reader-speaker" id="reader-speaker"></div>
        <div class="reader-text" id="reader-text"></div>
        <div class="reader-advance-hint" id="reader-hint">▶</div>
        <div class="reader-choices" id="reader-choices" style="display:none;"></div>
    </div>
    <div class="reader-ending-screen" id="reader-ending" style="display:none;">
        <div class="reader-ending-title">🏁 Конец</div>
        <div class="reader-ending-name" id="ending-name"></div>
        <div class="reader-ending-reward" id="ending-reward" style="display:none;"></div>
        <div class="reader-ending-actions">
            <button class="btn-restart" onclick="restartCurrentNovel()">Читать сначала</button>
            <button class="btn-back-list" onclick="closeReader()">К списку</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, increment, set } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAfrRE3nCFmodNEPac_plnoBuc_NvJbIgQ",
        authDomain: "book-2b50d.firebaseapp.com",
        databaseURL: "https://book-2b50d-default-rtdb.firebaseio.com",
        projectId: "book-2b50d",
        messagingSenderId: "461145405797",
        appId: "1:461145405797:web:ca65bb4b7f457d6b25098c"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tg = window.Telegram.WebApp;
    try { tg.expand(); tg.ready(); } catch (e) {}

    const params = new URLSearchParams(window.location.search);
    const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;
    const authUser = JSON.parse(localStorage.getItem('sr_auth_user') || 'null');

    let myId = null, myName = null;
    if (tgUser) { myId = String(tgUser.id); myName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || tgUser.username || 'Читатель'; }
    else if (params.get('uid')) { myId = params.get('uid'); myName = params.get('name') || 'Читатель'; }
    else if (authUser) { myId = authUser.id; myName = authUser.name; }

    function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
    function colorFor(str) {
        let hash = 0;
        for (let i = 0; i < (str || '').length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
        return `hsl(${hash % 360}, 60%, 55%)`;
    }
    function initialOf(str) { return (str || '?').trim().charAt(0).toUpperCase() || '?'; }

    if (!myId) {
        document.getElementById('no-session').style.display = 'block';
        document.getElementById('list-view').style.display = 'none';
    } else {
        init();
    }

    let novelsData = [];
    let myCoins = 0;
    let myProgress = {}; // { [novelId]: { unlocked, currentNodeId, completedEndings } }
    let pendingUnlockId = null;

    function init() {
        onValue(ref(db, 'novels'), (snap) => {
            const data = snap.val() || {};
            novelsData = Object.entries(data).map(([id, v]) => ({ id, ...v }));
            renderList();
        });
        onValue(ref(db, 'users/' + myId + '/coins'), (snap) => {
            myCoins = snap.val() || 0;
            document.getElementById('coins-badge').textContent = `🪙 ${myCoins}`;
        });
        onValue(ref(db, 'users/' + myId + '/novelProgress'), (snap) => {
            myProgress = snap.val() || {};
            renderList();
        });
    }

    function renderList() {
        const list = document.getElementById('novels-list');
        if (!novelsData.length) { list.innerHTML = '<div class="empty-state">Пока нет ни одной новеллы 📖</div>'; return; }
        list.innerHTML = novelsData.map(n => {
            const progress = myProgress[n.id] || {};
            const unlocked = !!progress.unlocked || !n.unlockCost;
            const endingsCount = Object.keys(progress.completedEndings || {}).length;
            let lockBadge = `<span class="novel-badge badge-locked">🪙 ${n.unlockCost}</span>`;
            if (!unlocked && n.unlockRequiresNovelId) {
                const reqProgress = myProgress[n.unlockRequiresNovelId] || {};
                const endings = Object.keys(reqProgress.completedEndings || {});
                const satisfied = n.unlockRequiresEndingKey ? endings.includes(n.unlockRequiresEndingKey) : endings.length > 0;
                if (!satisfied) lockBadge = `<span class="novel-badge badge-locked">🔒 нужна другая новелла</span>`;
            }
            return `
            <div class="novel-card" onclick="window.__openNovel('${n.id}')">
                ${n.coverImage ? `<img class="novel-cover" src="${n.coverImage}">` : `<div class="novel-cover" style="background:${colorFor(n.title)}">${initialOf(n.title)}</div>`}
                <div class="novel-info">
                    <div class="novel-title">${escapeHtml(n.title || 'Без названия')}</div>
                    <div class="novel-desc">${escapeHtml(n.description || '')}</div>
                    <div class="novel-meta">
                        ${unlocked ? '<span class="novel-badge badge-unlocked">Открыто</span>' : lockBadge}
                        ${endingsCount ? `<span class="novel-badge badge-endings">🏁 ${endingsCount} конц.</span>` : ''}
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    window.__openNovel = function (novelId) {
        const novel = novelsData.find(n => n.id === novelId);
        if (!novel) return;
        const progress = myProgress[novelId] || {};
        const unlocked = !!progress.unlocked || !novel.unlockCost;
        if (!unlocked) {
            if (novel.unlockRequiresNovelId) {
                const reqProgress = myProgress[novel.unlockRequiresNovelId] || {};
                const endings = Object.keys(reqProgress.completedEndings || {});
                const satisfied = novel.unlockRequiresEndingKey ? endings.includes(novel.unlockRequiresEndingKey) : endings.length > 0;
                if (!satisfied) {
                    const reqNovel = novelsData.find(n => n.id === novel.unlockRequiresNovelId);
                    tg.showAlert && tg.showAlert(`Сначала нужно пройти новеллу «${reqNovel ? reqNovel.title : '?'}»`);
                    return;
                }
            }
            pendingUnlockId = novelId;
            document.getElementById('unlock-modal-title').textContent = novel.title || 'Новелла';
            document.getElementById('unlock-modal-text').textContent = `Открыть за 🪙 ${novel.unlockCost}? У тебя ${myCoins} монет.`;
            document.getElementById('btn-confirm-unlock').disabled = myCoins < novel.unlockCost;
            document.getElementById('btn-confirm-unlock').textContent = myCoins < novel.unlockCost ? 'Недостаточно монет' : 'Открыть';
            document.getElementById('unlock-modal-overlay').classList.add('active');
            return;
        }
        openReader(novelId, progress.currentNodeId || novel.startNodeId);
    };

    window.closeUnlockModal = function () {
        document.getElementById('unlock-modal-overlay').classList.remove('active');
        pendingUnlockId = null;
    };

    document.getElementById('btn-confirm-unlock').onclick = function () {
        if (!pendingUnlockId) return;
        const novel = novelsData.find(n => n.id === pendingUnlockId);
        if (!novel || myCoins < novel.unlockCost) return;
        update(ref(db), {
            ['users/' + myId + '/coins']: increment(-novel.unlockCost),
            ['users/' + myId + '/novelProgress/' + pendingUnlockId + '/unlocked']: true,
        }).then(() => {
            const openId = pendingUnlockId;
            closeUnlockModal();
            openReader(openId, novel.startNodeId);
        }).catch(() => tg.showAlert && tg.showAlert('Ошибка открытия новеллы'));
    };

    // ===================== ЧТЕНИЕ =====================
    let currentNovel = null;
    let currentNode = null;
    let lineIndex = 0;
    let isAdminPreview = params.get('adminPreview') === '1';

    function openReader(novelId, nodeId) {
        currentNovel = novelsData.find(n => n.id === novelId);
        if (!currentNovel) return;
        document.getElementById('reader').classList.add('active');
        document.getElementById('reader-ending').style.display = 'none';
        loadNode(nodeId || currentNovel.startNodeId);
    }

    // Прямая ссылка из редактора на конкретную сцену для проверки — не трогает прогресс/монеты игрока
    if (isAdminPreview && params.get('novelId')) {
        document.getElementById('list-view').style.display = 'none';
        onValue(ref(db, 'novels/' + params.get('novelId')), (snap) => {
            const data = snap.val();
            if (!data) return;
            currentNovel = { id: params.get('novelId'), ...data, nodes: data.nodes || {} };
            document.getElementById('reader').classList.add('active');
            document.getElementById('reader-ending').style.display = 'none';
            loadNode(params.get('nodeId') || currentNovel.startNodeId);
        }, { onlyOnce: true });
    }

    window.closeReader = function () {
        document.getElementById('reader').classList.remove('active');
        currentNovel = null; currentNode = null;
        if (isAdminPreview) window.close();
    };

    window.restartCurrentNovel = function () {
        if (!currentNovel) return;
        document.getElementById('reader-ending').style.display = 'none';
        loadNode(currentNovel.startNodeId);
    };

    const musicPlayer = document.getElementById('reader-music') || (() => {
        const a = document.createElement('audio');
        a.id = 'reader-music'; a.loop = true; document.body.appendChild(a); return a;
    })();

    function loadNode(nodeId) {
        const nodes = currentNovel.nodes || {};
        const node = nodes[nodeId];
        if (!node) { closeReader(); return; }
        currentNode = { ...node, id: nodeId };
        lineIndex = 0;
        document.getElementById('reader-bg').style.background = node.background ? '' : '#1a1a2e';
        if (node.background) document.getElementById('reader-bg').style.backgroundImage = `url('${node.background}')`;
        document.getElementById('reader-choices').style.display = 'none';
        if (node.music && musicPlayer.src !== node.music) { musicPlayer.src = node.music; musicPlayer.play().catch(() => {}); }
        else if (!node.music) { musicPlayer.pause(); musicPlayer.src = ''; }
        // Сохраняем прогресс — при повторном открытии новеллы читатель попадёт на эту сцену (кроме предпросмотра админа)
        if (myId && !isAdminPreview) update(ref(db, 'users/' + myId + '/novelProgress/' + currentNovel.id), { currentNodeId: nodeId, unlocked: true }).catch(() => {});
        renderLine();
    }

    function renderLine() {
        const lines = currentNode.lines || [];
        const line = lines[lineIndex];
        const sprite = document.getElementById('reader-sprite');
        if (!line) { finishNode(); return; }
        const speakerEl = document.getElementById('reader-speaker');
        speakerEl.textContent = line.speaker || '';
        speakerEl.style.color = line.speakerColor || '#ffb75e';
        document.getElementById('reader-text').textContent = line.text || '';
        document.getElementById('reader-hint').textContent = (lineIndex < lines.length - 1) ? '▶' : (hasMoreAfterLines() ? '▶' : '✓');
        if (line.sprite) {
            sprite.src = line.sprite;
            sprite.style.display = 'block';
            sprite.className = 'reader-sprite speaking pos-' + (line.spritePosition || 'center');
        } else {
            sprite.style.display = 'none';
        }
    }

    function hasMoreAfterLines() {
        return !!(currentNode.choices && currentNode.choices.length) || !currentNode.isEnding;
    }

    window.advanceReader = function () {
        if (!currentNode) return;
        const lines = currentNode.lines || [];
        if (lineIndex < lines.length - 1) { lineIndex++; renderLine(); return; }
        finishNode();
    };

    function finishNode() {
        if (currentNode.isEnding) { showEnding(); return; }
        if (currentNode.choices && currentNode.choices.length) { showChoices(); return; }
        if (currentNode.nextNodeId) { loadNode(currentNode.nextNodeId); return; }
        // Ни выбора, ни продолжения, ни концовки не задано — считаем сцену тупиковой концовкой без названия
        showEnding();
    }

    function showChoices() {
        const box = document.getElementById('reader-choices');
        box.style.display = 'flex';
        box.innerHTML = (currentNode.choices || []).map((c, i) =>
            `<button class="reader-choice-btn" onclick="event.stopPropagation(); window.__pickChoice(${i})">${escapeHtml(c.text || '...')}</button>`
        ).join('');
    }

    window.__pickChoice = function (i) {
        const choice = (currentNode.choices || [])[i];
        if (!choice || !choice.nextNodeId) return;
        loadNode(choice.nextNodeId);
    };

    function showEnding() {
        const endingKey = currentNode.id;
        if (isAdminPreview) {
            document.getElementById('reader-ending').style.display = 'flex';
            document.getElementById('ending-name').textContent = (currentNode.endingName || 'Новелла завершена') + ' (предпросмотр, награда не выдаётся)';
            document.getElementById('ending-reward').style.display = 'none';
            return;
        }
        const already = !!((myProgress[currentNovel.id] || {}).completedEndings || {})[endingKey];
        document.getElementById('reader-ending').style.display = 'flex';
        document.getElementById('ending-name').textContent = currentNode.endingName || 'Новелла завершена';
        const rewardEl = document.getElementById('ending-reward');
        if (already) {
            rewardEl.style.display = 'none';
        } else {
            const parts = [];
            if (currentNode.endingRewardCoins) parts.push(`🪙 ${currentNode.endingRewardCoins}`);
            if (currentNode.endingRewardCardId && currentNode.endingRewardCardCount) parts.push(`🃏 ×${currentNode.endingRewardCardCount}`);
            if (parts.length) {
                rewardEl.style.display = 'block';
                rewardEl.textContent = 'Награда за новую концовку: ' + parts.join(' · ');
                const updates = { ['users/' + myId + '/novelProgress/' + currentNovel.id + '/completedEndings/' + endingKey]: true };
                if (currentNode.endingRewardCoins) updates['users/' + myId + '/coins'] = increment(currentNode.endingRewardCoins);
                if (currentNode.endingRewardCardId && currentNode.endingRewardCardCount) {
                    updates['users/' + myId + '/cardCollection/' + currentNode.endingRewardCardId] = increment(currentNode.endingRewardCardCount);
                }
                update(ref(db), updates).catch(() => {});
            } else {
                rewardEl.style.display = 'none';
                set(ref(db, 'users/' + myId + '/novelProgress/' + currentNovel.id + '/completedEndings/' + endingKey), true).catch(() => {});
            }
        }
    }
</script>
</body>
</html>
