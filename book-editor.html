<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Редактор книг</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(180deg, #fff8f0 0%, #fff 200px); color: #2c3e50; padding-bottom: 40px;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .back-link {
        text-decoration: none; color: #2c3e50; background: #fff; width: 40px; height: 40px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); flex-shrink: 0;
    }
    h1 { font-size: 20px; margin: 0; }
    .card { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); margin-bottom: 14px; }
    .input {
        width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e0e0e0; margin-bottom: 10px;
        font-size: 14px; background: #f4f6f7; font-family: inherit;
    }
    textarea.input { min-height: 160px; resize: vertical; }
    select.input { appearance: none; }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 14px; background: linear-gradient(135deg,#ffb75e,#ed8f03); color: #fff; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
    .btn-secondary { background: #f1f2f6; color: #2c3e50; }
    .upload-row { display: flex; gap: 8px; }
    .upload-row .input { flex: 1; margin-bottom: 0; }
    .upload-btn { background: #f1f2f6; border-radius: 12px; width: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .divider { height: 1px; background: #f0f0f0; margin: 16px 0; }
    .admin-item { display: flex; align-items: center; gap: 10px; background: #f8f9fa; border-radius: 12px; padding: 8px; margin-bottom: 8px; }
    .admin-item img, .cover-fallback-sm { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .cover-fallback-sm { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; background: #ed8f03; }
    .admin-item-info { flex: 1; font-size: 13px; min-width: 0; }
    .admin-item-info .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-item-info .s { color: #95a5a6; font-size: 12px; }
    .admin-item-actions { display: flex; gap: 6px; }
    .admin-item-actions button { border: none; border-radius: 8px; width: 30px; height: 30px; cursor: pointer; background: #f1f2f6; }
    .admin-item-actions button.danger { background: #fdecea; color: #e74c3c; }
    .empty-state { text-align: center; color: #95a5a6; padding: 20px 0; font-size: 14px; }
    .locked { text-align: center; padding: 40px 20px; }
</style>
</head>
<body>

<div class="container">
    <div class="topbar">
        <a href="app.html" class="back-link">←</a>
        <h1>📚 Редактор книг</h1>
    </div>

    <div id="no-session" class="card" style="display:none;">
        Не удалось определить пользователя. Открой эту страницу из профиля в приложении.
        <a href="app.html" style="display:block;margin-top:10px;color:#ed8f03;font-weight:700;">← Вернуться в приложение</a>
    </div>

    <div id="locked-view" class="card locked" style="display:none;">
        <div style="font-size:40px;margin-bottom:10px;">🔒</div>
        <div style="font-weight:700;margin-bottom:8px;">Доступ только для одобренных авторов</div>
        <div style="color:#7f8c8d;font-size:14px;margin-bottom:16px;">Подай заявку на публикацию книг, чтобы получить доступ к редактору.</div>
        <a href="publisher-application.html" class="btn" style="display:block;text-decoration:none;">📝 Подать заявку</a>
    </div>

    <div id="editor-root" style="display:none;">
        <div class="card">
            <h3 style="margin-top:0;" id="book-form-heading">Добавить книгу</h3>
            <input type="text" id="book-title" class="input" placeholder="Название">
            <div class="upload-row">
                <input type="text" id="book-cover" class="input" placeholder="Обложка (URL)">
                <label class="upload-btn" for="book-cover-file">📁</label>
                <input type="file" id="book-cover-file" accept="image/*" style="display:none;">
            </div>
            <input type="text" id="book-genre" class="input" placeholder="Жанр (напр. Фантастика)">
            <button class="btn" id="btn-add-book">Добавить книгу</button>
            <button class="btn btn-secondary" id="btn-cancel-edit-book" style="display:none;">Отменить редактирование</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">Главы</h3>
            <select id="chapter-book-select" class="input"></select>
            <div id="chapters-list"></div>
            <div class="divider"></div>
            <input type="text" id="chapter-title" class="input" placeholder="Название главы">
            <textarea id="chapter-text" class="input" placeholder="Текст главы..."></textarea>
            <button class="btn" id="btn-add-chapter">Опубликовать главу</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">Мои книги</h3>
            <div id="my-books-list"></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAfrRE3nCFmodNEPac_plnoBuc_NvJbIgQ",
        authDomain: "book-2b50d.firebaseapp.com",
        databaseURL: "https://book-2b50d-default-rtdb.firebaseio.com",
        projectId: "book-2b50d",
        messagingSenderId: "461145405797",
        appId: "1:461145405797:web:ca65bb4b7f457d6b25098c"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const IMGBB_API_KEY = 'ac1c48b003ee1441183cef03cce5a0a4';

    const tg = window.Telegram.WebApp;
    try { tg.expand(); tg.ready(); } catch (e) {}

    const params = new URLSearchParams(window.location.search);
    const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;
    const authUser = JSON.parse(localStorage.getItem('sr_auth_user') || 'null');

    let myId = null, myName = null;
    if (tgUser) { myId = String(tgUser.id); myName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || tgUser.username || 'Читатель'; }
    else if (params.get('uid')) { myId = params.get('uid'); myName = params.get('name') || 'Читатель'; }
    else if (authUser) { myId = authUser.id; myName = authUser.name; }

    function escapeHtml(str) {
        const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML;
    }
    function colorFor(str) {
        let hash = 0;
        for (let i = 0; i < (str || '').length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
        return `hsl(${hash % 360}, 60%, 55%)`;
    }
    function initialOf(str) { return (str || '?').trim().charAt(0).toUpperCase() || '?'; }
    function getChapters(book) {
        if (book.chapters) return Object.entries(book.chapters).map(([id, c]) => ({ id, ...c })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        if (book.text) return [{ id: 'legacy', title: 'Глава 1', text: book.text }];
        return [];
    }

    if (!myId) {
        document.getElementById('no-session').style.display = 'block';
    } else {
        onValue(ref(db, 'users/' + myId), (snap) => {
            const me = snap.val();
            const allowed = !!(me && me.isPublisher);
            document.getElementById(allowed ? 'editor-root' : 'locked-view').style.display = 'block';
            document.getElementById(allowed ? 'locked-view' : 'editor-root').style.display = 'none';
            if (allowed) startEditor();
        });
    }

    let editorStarted = false;
    function startEditor() {
        if (editorStarted) return;
        editorStarted = true;

        let booksData = [];
        let editingBookId = null;

        onValue(ref(db, 'books'), (snap) => {
            const data = snap.val();
            const all = data ? Object.entries(data).map(([id, v]) => ({ id, ...v })) : [];
            booksData = all.filter(b => b.authorId === myId);
            renderMyBooks();
            populateChapterSelect();
        });

        function renderMyBooks() {
            const el = document.getElementById('my-books-list');
            if (!booksData.length) { el.innerHTML = '<div class="empty-state">Ты пока не добавил ни одной книги</div>'; return; }

            el.innerHTML = booksData.map(book => `
                <div class="admin-item">
                    ${book.coverImage ? `<img src="${book.coverImage}" onerror="this.style.display='none'">` : `<div class="cover-fallback-sm" style="background:${colorFor(book.title)}">${initialOf(book.title)}</div>`}
                    <div class="admin-item-info">
                        <div class="t">${escapeHtml(book.title)}</div>
                        <div class="s">${getChapters(book).length} гл.</div>
                    </div>
                    <div class="admin-item-actions">
                        <button data-id="${book.id}" data-action="edit">✏️</button>
                        <button class="danger" data-id="${book.id}" data-action="delete">🗑</button>
                    </div>
                </div>
            `).join('');

            el.querySelectorAll('button[data-id]').forEach(btn => {
                btn.onclick = () => {
                    if (btn.dataset.action === 'edit') editBook(btn.dataset.id);
                    else deleteBook(btn.dataset.id);
                };
            });
        }

        function editBook(id) {
            const book = booksData.find(b => b.id === id);
            if (!book) return;
            editingBookId = id;
            document.getElementById('book-title').value = book.title || '';
            document.getElementById('book-cover').value = book.coverImage || '';
            document.getElementById('book-genre').value = book.genre || '';
            document.getElementById('book-form-heading').textContent = 'Редактировать книгу';
            document.getElementById('btn-add-book').textContent = 'Сохранить изменения';
            document.getElementById('btn-cancel-edit-book').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('btn-cancel-edit-book').onclick = function() {
            editingBookId = null;
            document.getElementById('book-title').value = '';
            document.getElementById('book-cover').value = '';
            document.getElementById('book-genre').value = '';
            document.getElementById('book-form-heading').textContent = 'Добавить книгу';
            document.getElementById('btn-add-book').textContent = 'Добавить книгу';
            document.getElementById('btn-cancel-edit-book').style.display = 'none';
        };

        function deleteBook(id) {
            if (!confirm('Удалить книгу безвозвратно? Все главы будут стёрты.')) return;
            remove(ref(db, 'books/' + id)).catch(err => alert('Ошибка: ' + err.message));
        }

        document.getElementById('book-cover-file').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('image', file);
            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const json = await res.json();
                if (json.success) document.getElementById('book-cover').value = json.data.url;
                else alert('Ошибка загрузки: ' + (json.error?.message || 'неизвестная'));
            } catch (err) { alert('Ошибка сети при загрузке обложки'); }
        });

        document.getElementById('btn-add-book').onclick = function() {
            const title = document.getElementById('book-title').value.trim();
            if (!title) return alert('Укажи название книги');

            const data = {
                title,
                author: myName,
                authorId: myId,
                coverImage: document.getElementById('book-cover').value.trim(),
                genre: document.getElementById('book-genre').value.trim()
            };

            if (editingBookId) {
                update(ref(db, 'books/' + editingBookId), data).then(() => document.getElementById('btn-cancel-edit-book').click())
                    .catch(err => alert('Ошибка: ' + err.message));
            } else {
                push(ref(db, 'books'), { ...data, createdAt: Date.now() }).then(() => {
                    document.getElementById('btn-cancel-edit-book').click();
                    alert('Книга добавлена! Теперь можно добавить главы ниже.');
                }).catch(err => alert('Ошибка: ' + err.message));
            }
        };

        function populateChapterSelect() {
            const sel = document.getElementById('chapter-book-select');
            const prev = sel.value;
            sel.innerHTML = booksData.length
                ? booksData.map(b => `<option value="${b.id}">${escapeHtml(b.title)}</option>`).join('')
                : '<option value="">Сначала добавь книгу</option>';
            if (booksData.some(b => b.id === prev)) sel.value = prev;
            renderChaptersList();
        }

        document.getElementById('chapter-book-select').addEventListener('change', renderChaptersList);

        function renderChaptersList() {
            const bookId = document.getElementById('chapter-book-select').value;
            const container = document.getElementById('chapters-list');
            const book = booksData.find(b => b.id === bookId);
            if (!book) { container.innerHTML = ''; return; }

            const chapters = getChapters(book);
            container.innerHTML = chapters.length
                ? chapters.map((ch, idx) => `
                    <div class="admin-item" style="padding:8px;">
                        <div class="admin-item-info"><div class="t">${escapeHtml(ch.title || ('Глава ' + (idx + 1)))}</div></div>
                        <div class="admin-item-actions"><button class="danger" data-cid="${ch.id}">🗑</button></div>
                    </div>
                `).join('')
                : '<div class="empty-state">Глав пока нет</div>';

            container.querySelectorAll('button[data-cid]').forEach(btn => {
                btn.onclick = () => {
                    if (!confirm('Удалить эту главу?')) return;
                    const path = btn.dataset.cid === 'legacy' ? `books/${bookId}/text` : `books/${bookId}/chapters/${btn.dataset.cid}`;
                    remove(ref(db, path)).catch(err => alert('Ошибка: ' + err.message));
                };
            });
        }

        document.getElementById('btn-add-chapter').onclick = function() {
            const bookId = document.getElementById('chapter-book-select').value;
            const title = document.getElementById('chapter-title').value.trim();
            const text = document.getElementById('chapter-text').value.trim();
            if (!bookId) return alert('Сначала добавь книгу');
            if (!text) return alert('Введи текст главы');

            push(ref(db, 'books/' + bookId + '/chapters'), { title, text, createdAt: Date.now() }).then(() => {
                document.getElementById('chapter-title').value = '';
                document.getElementById('chapter-text').value = '';
                tg.showPopup ? tg.showPopup({ title: 'Готово', message: 'Глава опубликована', buttons: [{ type: 'ok' }] }) : alert('Глава добавлена');
            }).catch(err => alert('Ошибка: ' + err.message));
        };
    }
</script>
</body>
</html>
